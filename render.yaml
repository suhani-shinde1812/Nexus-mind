# ==============================================================================
# Nexus Mind Enterprise — Render Production Infrastructure Blueprint
# ==============================================================================

databases:
  - name: nexusmind-postgres
    databaseName: nexusmind
    user: nexus
    plan: free
    region: oregon

services:
  # 1. Redis / Key-Value Cache for Real-Time WebSocket Pub/Sub
  - type: redis
    name: nexusmind-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # 2. Unified FastAPI & Single-Page Application (SPA) Web Service
  - type: web
    name: nexusmind-platform
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexusmind-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexusmind-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
