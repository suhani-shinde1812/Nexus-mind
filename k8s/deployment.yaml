apiVersion: v1
kind: Namespace
metadata:
  name: nexusmind
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexusmind-config
  namespace: nexusmind
data:
  ENVIRONMENT: "production"
  DEMO_MODE: "false"
  REDIS_URL: "redis://nexusmind-redis.nexusmind.svc.cluster.local:6379/0"
  CORS_ORIGINS: "https://app.nexusmind.ai,https://portal.nexusmind.ai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-backend
  namespace: nexusmind
  labels:
    app: nexusmind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexusmind-backend
  template:
    metadata:
      labels:
        app: nexusmind-backend
    spec:
      containers:
        - name: backend
          image: nexusmind/backend:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexusmind-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexusmind-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusmind-secrets
                  key: jwt-secret-key
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusmind-secrets
                  key: encryption-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexusmind-secrets
                  key: github-webhook-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusmind-worker
  namespace: nexusmind
  labels:
    app: nexusmind-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexusmind-worker
  template:
    metadata:
      labels:
        app: nexusmind-worker
    spec:
      containers:
        - name: worker
          image: nexusmind/backend:2.0.0
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: nexusmind-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexusmind-secrets
                  key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: nexusmind-backend-svc
  namespace: nexusmind
spec:
  selector:
    app: nexusmind-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
