apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusmind-ingress
  namespace: nexusmind
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "nexusmind-backend-svc"
spec:
  tls:
    - hosts:
        - app.nexusmind.ai
      secretName: nexusmind-tls-cert
  rules:
    - host: app.nexusmind.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusmind-backend-svc
                port:
                  number: 8000
